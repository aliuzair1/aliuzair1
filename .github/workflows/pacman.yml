name: Generate pacman animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Temporary fallback only if an action still depends on Node 20:
    # env:
    #   ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Generate pacman SVG
        # Replace with a pinned tag/commit you trust, do not use @main
        uses: abozanona/pacman-contribution-graph@v0.1.0
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Debug generated files
        run: |
          echo "Workspace:"
          pwd
          ls -la
          echo "Dist:"
          ls -la dist || true

      - name: Ensure dist exists
        run: |
          test -d dist || (echo "dist directory not found"; exit 1)

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
